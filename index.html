<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060708">
  <meta name="description" content="Marcin Dudkowski — architecture graduate, BIM Coordinator and digital maker. Explore a connected portfolio of architecture, BIM, research and personal interests.">
  <title>Marcin Dudkowski — Architecture, BIM & Digital Craft</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#project-index">Skip to project index</a>
  <header class="site-header">
    <a class="identity" href="#" aria-label="Marcin Dudkowski, return to network"><span class="identity-name">Marcin Dudkowski<span>Architecture / BIM / Digital craft</span></span></a>
    <nav class="header-nav" aria-label="Main navigation">
      <a class="contact-link" href="mailto:mjdudkowski@gmail.com">Let’s connect</a>
      <button id="open-search" class="icon-button" aria-label="Search projects" title="Search projects ( / )"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    </nav>
  </header>

  <main id="network-home">
    <h1 class="sr-only">Marcin Dudkowski — portfolio</h1>
    <section id="network-stage" aria-label="Interactive project network">
      <canvas id="network-lines" aria-hidden="true"></canvas>
      <div id="network-nodes"></div>
    </section>
    <aside id="hover-preview" class="hover-preview" hidden aria-hidden="true"><img alt=""><div><span></span><strong></strong><p></p></div></aside>
    <div class="view-tools" aria-label="Network controls">
      <button class="icon-button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="icon-button" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
      <button class="icon-button" id="reset-view" aria-label="Reset network view" title="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M4.5 4.5l4 4M20 9V4h-5M19.5 4.5l-4 4M4 15v5h5m-4.5-.5 4-4M20 15v5h-5m4.5-.5-4-4"/></svg></button>
      <button class="icon-button" id="toggle-motion" aria-label="Pause network motion" aria-pressed="false" title="Pause motion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    </div>
    <footer class="network-footer">
      <nav id="category-filters" aria-label="Filter portfolio">
        <button class="filter active" data-filter="all" aria-pressed="true">All connections</button>
        <button class="filter" data-filter="bim" aria-pressed="false">BIM</button>
        <button class="filter" data-filter="research" aria-pressed="false">Research</button>
        <button class="filter" data-filter="architecture" aria-pressed="false">Architecture</button>
        <button class="filter" data-filter="university" aria-pressed="false">University</button>
        <button class="filter" data-filter="interests" aria-pressed="false">Beyond work</button>
      </nav>
      <button id="open-index" class="index-toggle"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg> Project index</button>
    </footer>
  </main>

  <article id="project-page" hidden tabindex="-1" aria-labelledby="project-title">
    <div class="project-toolbar"><button id="back-to-network" class="text-button">Back to network</button><span id="project-location"></span></div>
    <div id="project-content"></div>
    <footer class="project-footer"><span>Marcin Dudkowski</span><a href="mailto:mjdudkowski@gmail.com">Let’s connect</a></footer>
  </article>

  <dialog id="project-index" aria-labelledby="index-heading">
    <div class="dialog-heading"><div><p class="eyebrow">Explore the portfolio</p><h2 id="index-heading">Project index</h2></div><button class="close-button" data-close="project-index" aria-label="Close project index">×</button></div>
    <div class="index-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" id="project-search" placeholder="Search projects, skills or interests" aria-label="Search projects, skills or interests" autocomplete="off"><kbd>/</kbd></div>
    <p id="search-status" class="sr-only" aria-live="polite"></p>
    <div id="index-results"></div>
  </dialog>
  <dialog id="image-viewer" aria-label="Enlarged project image"><button class="close-button" data-close="image-viewer" aria-label="Close image">×</button><div class="image-viewport"><img alt=""></div><div class="image-viewer-footer"><p></p><div class="image-zoom-tools"><button id="image-zoom-out" aria-label="Zoom image out">−</button><button id="image-fit">Fit</button><button id="image-zoom-in" aria-label="Zoom image in">+</button></div></div></dialog>
  <noscript><div class="no-script"><h1>Marcin Dudkowski</h1><p>Architecture graduate and BIM Coordinator.</p><p>Enable JavaScript to explore the portfolio and open the project pages.</p></div></noscript>
  <script src="graph.js"></script>
  <script src="markdown.js"></script>
  <script src="network.js"></script>
  <script src="app.js"></script>
</body>
</html>
